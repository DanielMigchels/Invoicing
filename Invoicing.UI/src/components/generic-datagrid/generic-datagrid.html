<div *ngIf="totalItems > 0" class="w-full">
  <div class="overflow-x-auto rounded">
    <table class="min-w-full divide-y divide-slate-700">
      <thead class="bg-slate-900">
        <tr>
          <th *ngFor="let column of columns"
            class="px-6 py-3 text-left text-xs font-medium text-slate-400 uppercase tracking-wider">
            <ng-container *ngTemplateOutlet="column.template"></ng-container>
          </th>
        </tr>
      </thead>
      <tbody class="bg-slate-800 divide-y divide-slate-700">
        <tr *ngFor="let row of rows" class="hover:bg-slate-900 transition-colors">
          <td *ngFor="let cell of row.cells" class="px-6 py-4 text-sm text-white">
            <ng-container *ngTemplateOutlet="cell.template"></ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="data" class="mt-4 flex items-center justify-between">
    <div class="text-sm text-slate-400">
      Page {{ data.page }} | {{ totalItems }} items
    </div>
    <div class="flex gap-2">
      <button (click)="onPrevious()" [disabled]="!data.hasPrevious"
        class="px-4 py-2 text-sm font-medium rounded transition-colors"
        [ngClass]="{'bg-blue-600 text-white hover:bg-blue-500 cursor-pointer': data.hasPrevious,'bg-slate-700 text-slate-500 cursor-not-allowed': !data.hasPrevious}">
        Previous
      </button>
      <button (click)="onNext()" [disabled]="!data.hasNext"
        class="px-4 py-2 text-sm font-medium rounded transition-colors"
        [ngClass]="{ 'bg-blue-600 text-white hover:bg-blue-500 cursor-pointer': data.hasNext, 'bg-slate-700 text-slate-500 cursor-not-allowed': !data.hasNext }">
        Next
      </button>
    </div>
  </div>
</div>

<div *ngIf="totalItems === 0" class="text-center py-8 text-slate-400">
  <p>No data available</p>
</div>

<div style="display: none;">
  <ng-content></ng-content>
</div>
