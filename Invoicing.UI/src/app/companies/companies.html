<div class="flex justify-between w-ful items-center">
<h1>Companies</h1>
<button class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded cursor-pointer transition-colors" (click)="addCompany($event)">Add company</button>
</div>


<app-generic-datagrid [data]="companies" (next)="onNext()" (previous)="onPrevious()">
    <app-generic-datagrid-columns>
      <app-generic-datagrid-column>Name</app-generic-datagrid-column>
      <app-generic-datagrid-column>Email</app-generic-datagrid-column>
      <app-generic-datagrid-column>Phone Number</app-generic-datagrid-column>
      <app-generic-datagrid-column>City</app-generic-datagrid-column>
      <app-generic-datagrid-column>Country</app-generic-datagrid-column>
      <app-generic-datagrid-column>Actions</app-generic-datagrid-column>
    </app-generic-datagrid-columns>
    <app-generic-datagrid-row *ngFor="let item of companies?.data" [item]="item">
      <app-generic-datagrid-cell>{{ item.name }}</app-generic-datagrid-cell>
      <app-generic-datagrid-cell>{{ item.email }}</app-generic-datagrid-cell>
      <app-generic-datagrid-cell>{{ item.phoneNumber }}</app-generic-datagrid-cell>
      <app-generic-datagrid-cell>{{ item.city }}</app-generic-datagrid-cell>
      <app-generic-datagrid-cell>{{ item.country }}</app-generic-datagrid-cell>
      <app-generic-datagrid-cell>
        <div class="flex gap-2">
          <button (click)="editCompany($event, item)" class="px-2 py-1 text-xs bg-blue-600/20 text-blue-400 rounded hover:bg-blue-600/30 cursor-pointer">Edit</button>
          <button (click)="deleteCompany($event, item)" class="px-2 py-1 text-xs bg-red-600/20 text-red-400 rounded hover:bg-red-600/30 cursor-pointer">Delete</button>
        </div>
      </app-generic-datagrid-cell>
    </app-generic-datagrid-row>
  </app-generic-datagrid>

  

<app-create-company #addCompanyDrawer (drawerClosed)="loadCompanies()"></app-create-company>
<app-edit-company #editCompanyDrawer [company]="selectedCompany" (drawerClosed)="loadCompanies()"></app-edit-company>
<app-delete-company #deleteCompanyDrawer [company]="selectedCompany" (drawerClosed)="loadCompanies()"></app-delete-company>
