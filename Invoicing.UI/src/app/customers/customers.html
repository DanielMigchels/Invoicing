<div class="flex justify-between w-full items-center mb-6">
  <h1 class="text-2xl font-bold">Customers</h1>
  <button class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded cursor-pointer transition-colors" (click)="addCustomer($event)">Add customer</button>
</div>

<app-generic-datagrid [data]="customers" (next)="onNext()" (previous)="onPrevious()">
  <app-generic-datagrid-columns>
    <app-generic-datagrid-column>Name</app-generic-datagrid-column>
    <app-generic-datagrid-column>Contact Person</app-generic-datagrid-column>
    <app-generic-datagrid-column>Email</app-generic-datagrid-column>
    <app-generic-datagrid-column>Phone Number</app-generic-datagrid-column>
    <app-generic-datagrid-column>City</app-generic-datagrid-column>
    <app-generic-datagrid-column>Country</app-generic-datagrid-column>
    <app-generic-datagrid-column>Actions</app-generic-datagrid-column>
  </app-generic-datagrid-columns>
  <app-generic-datagrid-row *ngFor="let item of customers?.data" [item]="item">
    <app-generic-datagrid-cell>{{ item.name }}</app-generic-datagrid-cell>
    <app-generic-datagrid-cell>{{ item.contactPerson ?? '—' }}</app-generic-datagrid-cell>
    <app-generic-datagrid-cell>{{ item.email ?? '—' }}</app-generic-datagrid-cell>
    <app-generic-datagrid-cell>{{ item.phoneNumber ?? '—' }}</app-generic-datagrid-cell>
    <app-generic-datagrid-cell>{{ item.city }}</app-generic-datagrid-cell>
    <app-generic-datagrid-cell>{{ item.country }}</app-generic-datagrid-cell>
    <app-generic-datagrid-cell>
      <div class="flex gap-2">
        <button (click)="editCustomer($event, item)" class="px-2 py-1 text-xs bg-blue-600/20 text-blue-400 rounded hover:bg-blue-600/30 cursor-pointer">Edit</button>
        <button (click)="deleteCustomer($event, item)" class="px-2 py-1 text-xs bg-red-600/20 text-red-400 rounded hover:bg-red-600/30 cursor-pointer">Delete</button>
      </div>
    </app-generic-datagrid-cell>
  </app-generic-datagrid-row>
</app-generic-datagrid>

<app-create-customer #addCustomerDrawer (drawerClosed)="loadCustomers()"></app-create-customer>
<app-edit-customer #editCustomerDrawer [customer]="selectedCustomer" (drawerClosed)="loadCustomers()"></app-edit-customer>
<app-delete-customer #deleteCustomerDrawer [customer]="selectedCustomer" (drawerClosed)="loadCustomers()"></app-delete-customer>
